# Managed by bot-manavarya/reviewer — edits will be overwritten.
name: manavarya-bot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  # Read-only is all the bot needs; it authenticates with its own token.
  contents: read
  pull-requests: read

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/bot'))
    # NOTE: pinning to a commit SHA is not possible from this fork — the
    # bot-manavarya/reviewer repository is not publicly resolvable (404 via
    # API/search), so no SHA can be obtained for the @main ref. The
    # actions/unpinned-tag finding on this line is accepted as a fork
    # limitation; the workflow cannot run here anyway (missing
    # MANAVARYA_BOT_TOKEN / GEMINI_API_KEY secrets on the fork).
    uses: bot-manavarya/reviewer/.github/workflows/review.yml@main
    with:
      provider: 'gemini'
      model: 'gemini-2.5-flash'
    secrets:
      bot-token: ${{ secrets.MANAVARYA_BOT_TOKEN }}
      gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
